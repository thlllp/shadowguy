name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check src/ tests/
      - name: Pytest
        run: uv run pytest -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group gui
      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa
      - name: Pytest (GUI)
        run: uv run --group gui pytest -q tests/test_gui.py tests/test_gui_views.py tests/test_gui_draw.py
